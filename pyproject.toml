[project]
name = "rss-qbittorent-reciever"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.141.1",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "qbittorrent-api>=2026.8.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.3",
]

[project.scripts]
rss-qbittorent-reciever = "rss_qbittorent_reciever:main"

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
