
{% extends "base.html" %}

{% block content %}
    <h1>RSS Feeds</h1>
    <div class="header-actions">
        <form action="/add_feed" method="post" class="add-feed-form">
            <input type="text" name="url" placeholder="RSS Feed URL" required>
            <input type="text" name="keyword_filter" placeholder="Keyword Filter">
            <input type="text" name="download_path" placeholder="Download Path (e.g. E:\Anilibria.Top\Autumn 2025)">
            <button type="submit">Add Feed</button>
        </form>
        <form action="/refresh_all" method="post" style="display:inline; margin-top: 1.5rem;">
            <button type="submit" class="refresh-all-btn">Refresh All</button>
        </form>
    </div>
    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>URL</th>
                <th>Keyword Filter</th>
                <th>Download Path</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for feed in feeds %}
            <tr>
                <td>{{ feed.title }}</td>
                <td>{{ feed.url }}</td>
                <td>{{ feed.keyword_filter }}</td>
                <td>{{ feed.download_path }}</td>
                <td>
                    <a href="/history/{{ feed.id }}">History</a>
                    <form action="/delete_feed/{{ feed.id }}" method="post" style="display:inline;">
                        <button type="submit">Delete</button>
                    </form>
                    <form action="/refresh_feed/{{ feed.id }}" method="post" style="display:inline;">
                        <button type="submit">Refresh</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
